<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Rock Paper Scissors Tutorial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Rock Paper Scissors</h1>
        <p>The winner is the first one that gets a score of 5. Have fun!</p>
    </header>
    <main>
        <!-- Canvas del gioco -->
        <div class="row">
            <!-- la colonna che mostra l'area di gioco -->
            <div class="column-3-4">
                <!-- Punteggio -->
                <div class="row">
                    <h2>Computer <span id="computer-score">0</span> - <span id="user-score">0</span> You</h2>
                </div>
                <div class="row">
                    <!-- la colonna che mostra la scelta del computer -->
                    <div class="column">
                        <h2>Computer Choice: <span id="computer-choice"></span>
                            <img class="choice-icon" id="computer-choice-img" alt="" draggable="false">
                        </h2>
                    </div>
                    <!-- la colonna che mostra le immagini premio -->
                    <div class="column">
                        <div class="reward-track">
                            <figure class="reward" data-image="1">
                                <img src="images/reward_1/image_1.png" alt="Reward 1" draggable="false">
                            </figure>
                            <figure class="reward" data-image="2">
                                <img src="images/reward_1/image_2.png" alt="Reward 3" draggable="false">
                            </figure>
                            <figure class="reward" data-image="3">
                                <img src="images/reward_1/image_3.png" alt="Reward 5" draggable="false">
                            </figure>
                            <figure class="reward" data-image="4">
                                <img src="images/reward_1/image_4.png" alt="Reward 4" draggable="false">
                            </figure>
                            <figure class="reward" data-image="5">
                                <img src="images/reward_1/image_5.png" alt="Reward 2" draggable="false">
                            </figure>
                        </div>
                    </div>
                    <!-- la colonna che mostra la scelta dell'utente -->
                    <div class="column">
                        <h2>User Choice: <span id="user-choice"></span>
                            <img class="choice-icon" id="user-choice-img" alt="" draggable="false">
                        </h2>
                    </div>
                </div>
            </div>
            <!-- la colonna che mostra i pulsanti, in colonna, per permettere all'utente di scegliere -->
            <div class="column-1-4">
                <div class="choices">
                    <button id="rock" type="button">
                        <img src="images/tools/rock.png" alt="" draggable="false">
                        <span class="choice-label">Rock</span>
                    </button>
                    <button id="paper" type="button">
                        <img src="images/tools/paper.png" alt="" draggable="false">
                        <span class="choice-label">Paper</span>
                    </button>
                    <button id="scissors" type="button">
                        <img src="images/tools/scissors.png" alt="" draggable="false">
                        <span class="choice-label">Scissors</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <!-- Il vincitore è... () -->
    <section>
        <h1 id="the-winner-is"></h1>
    </section>
    <!-- Modal: interrompe il gioco quando qualcuno arriva a 5 -->
    <div class="modal" id="game-over-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <p class="modal-eyebrow">Game over</p>
            <h1 id="modal-title"></h1>
            <img class="modal-reward" id="modal-reward" alt="" draggable="false">
            <p class="modal-score">Computer <span id="modal-computer-score">0</span> - <span
                    id="modal-user-score">0</span> You</p>
            <button id="play-again" type="button">Play again</button>
        </div>
    </div>
    <script src="index.js" charset="utf-8"></script>
</body>

</html>
